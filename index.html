<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 감정일기 - 오늘의 하루는 어땠나요?</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Pretendard 또는 Noto Sans KR 추천 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 id="main-title">오늘의 하루는 어땠나요?</h1>
            <p class="subtitle">AI가 당신의 소중한 감정을 들어드릴게요.</p>
        </header>

        <main>
            <section class="input-section">
                <textarea id="diary-input" placeholder="여기에 오늘의 이야기를 들려주세요..."></textarea>
                
                <div class="button-group">
                    <button id="voice-btn" class="secondary-btn">
                        <span class="icon">🎤</span> 음성으로 입력하기
                    </button>
                    <button id="analyze-btn" class="primary-btn">
                        분석 요청하기
                    </button>
                </div>
            </section>

            <section class="result-section">
                <h2 id="result-title">AI의 답변</h2>
                <div id="ai-response-box" class="response-box">
                    여기에 AI의 답변이 표시됩니다.
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2024 AI 감정일기. All rights reserved.</p>
        </footer>
    </div>
    <script type="module" src="/script.js"></script>
</body>
</html>
